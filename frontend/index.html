<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/calendar.css">
</head>
<body>
    <div class="container">
        <!-- Карточка выбора даты -->
        <div class="card">
            <label class="card-label" for="date-input">Дата курса</label>
            <div class="date-input-group">
                <input
                    type="text"
                    id="date-input"
                    class="date-input"
                    placeholder="ДД.ММ.ГГГГ"
                    maxlength="10"
                >
                <!-- Live Preview курса (справа от поля ввода) -->
                <div id="rate-preview" class="rate-preview">
                    <span class="rate-preview-label">Курс:</span>
                    <span id="rate-value" class="rate-value">—</span>
                </div>
                <!-- Кнопка "О программе" -->
                <button type="button" id="about-btn" class="about-btn" aria-label="О программе" title="О программе">Инфо</button>
            </div>
            <!-- Календарь (всегда видимый) -->
            <div id="calendar" class="calendar"></div>
        </div>

        <!-- Карточка выбора валюты -->
        <div class="card">
            <label class="card-label">Валюта</label>
            <div class="currency-group">
                <label class="radio-label">
                    <input type="radio" name="currency" value="USD" id="currency-usd" checked>
                    <span class="radio-text">USD ($)</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="currency" value="EUR" id="currency-eur">
                    <span class="radio-text">EUR (€)</span>
                </label>
            </div>
        </div>

        <!-- Карточка ввода суммы -->
        <div class="card">
            <label class="card-label" for="amount-input">Сумма</label>
                <input 
                    type="text" 
                    id="amount-input" 
                    class="amount-input" 
                    placeholder="Введите сумму для конвертации"
                    inputmode="decimal"
                >
        </div>

        <!-- Кнопка конвертации -->
        <button type="button" id="convert-btn" class="convert-btn">
            Конвертировать
        </button>

        <!-- Карточка результата -->
        <div class="card result-card hidden" id="result-card">
            <label class="card-label">Результат</label>
            <div class="result-content">
                <div class="result-summary" aria-live="polite">
                    <div id="result-amount" class="result-amount">—</div>
                    <div id="result-meta" class="result-meta"></div>
                    <!-- Полная строка результата хранится для копирования и совместимости -->
                    <div id="result-text" class="result-text hidden"></div>
                </div>

                <div class="result-actions">
                    <button
                        type="button"
                        id="copy-btn"
                        class="copy-btn"
                        aria-label="Копировать результат"
                    >
                        📋 Копировать
                    </button>
                </div>
            </div>
        </div>

        <!-- Строка состояния -->
        <div id="status-bar" class="status-bar hidden">
            <span id="status-icon" class="status-icon"></span>
            <span id="status-message" class="status-message"></span>
        </div>
    </div>

    <!-- Модальное окно "О программе" -->
    <dialog id="about-modal" class="about-modal">
        <div class="about-modal-content">
            <button type="button" class="about-modal-close" aria-label="Закрыть">&times;</button>

            <!-- Иконка приложения -->
            <div class="about-icon">
                <svg width="64" height="64" viewBox="0 0 122.88 122.88" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#0078d4" d="M30.27,0H92.61a30.35,30.35,0,0,1,30.27,30.27V92.61a30.35,30.35,0,0,1-30.27,30.27H30.27A30.35,30.35,0,0,1,0,92.61V30.27A30.35,30.35,0,0,1,30.27,0Zm40,71.93v9.13H59.17V89.8H43.48V81.06H37.23V71.93h6.25V67H37.23V57.89h6.25V33.08H67.94q9.36,0,14.42,4.17c3.35,2.79,5,6.91,5,12.39q0,8.47-5.43,12.91T66,67H59.17v4.92Zm-11.06-14H63.4a12.42,12.42,0,0,0,4.29-.65,7.29,7.29,0,0,0,2.77-1.73A6.28,6.28,0,0,0,72,53a9,9,0,0,0,.45-2.88,8.7,8.7,0,0,0-.37-2.55,5.81,5.81,0,0,0-1.32-2.34,6.58,6.58,0,0,0-2.55-1.69,11.13,11.13,0,0,0-4.09-.65H59.17v15ZM92.61,12.1H30.27A18.23,18.23,0,0,0,12.1,30.27V92.61a18.23,18.23,0,0,0,18.17,18.17H92.61a18.23,18.23,0,0,0,18.17-18.17V30.27A18.23,18.23,0,0,0,92.61,12.1Z"/>
                </svg>
            </div>

            <!-- Название и версия -->
            <h2 class="about-title">Конвертер валют</h2>
            <p class="about-version">Версия 1.2.1</p>

            <hr class="about-divider">

            <!-- Описание -->
            <p class="about-description">
                Конвертирует доллары и евро в рубли<br>
                по курсу ЦБ РФ на выбранную дату
            </p>

            <hr class="about-divider">

            <!-- Автор -->
            <div class="about-author">
                <p><strong>Автор:</strong> BiV</p>
                <p><strong>Email:</strong> <a href="mailto:biv@lesnet.ru" class="about-link">biv@lesnet.ru</a></p>
                <p class="about-copyright">© 2026</p>
            </div>

            <hr class="about-divider">

            <!-- Призыв к действию -->
            <div class="about-cta">
                <p class="about-cta-text">
                    Если вам понравилась эта программа,<br>
                    киньте мне виртуальную "Звезду" в Telegram.<br>
                    Вам это ничего не стоит, а мне будет приятно!
                </p>
                <button type="button" id="send-star-btn" class="send-star-btn">
                    <span class="star-icon">⭐</span>
                    Послать звезду!
                </button>
            </div>
        </div>
    </dialog>

    <script src="wailsjs/wailsjs/runtime/runtime.js"></script>
    <script src="scripts/utils.js"></script>
    <script src="scripts/status-bar.js"></script>
    <script src="scripts/calendar.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
